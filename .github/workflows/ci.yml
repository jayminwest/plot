name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Canonical quiet runner: lint, typecheck, check:agents, check:dups,
      # check:deps, check:size, check:debt, check:coverage, check:ci-parity
      # (docs/check-all-standard.md at the os-eco root).
      - name: Quality gates (check:all)
        run: bun run check:all

      # Same suite as the check:coverage gate, re-run with junit + lcov
      # reporters for the artifact uploads below (aliased to check:coverage
      # in scripts/ci-parity-config.json).
      - name: Run tests (CI reporter)
        run: bun run test:ci

      - name: Test timing summary
        if: always()
        run: bun run report:test-timing

      - name: Code-quality metrics summary
        if: always()
        run: bun run report:quality-metrics

      - name: Upload test timing artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bun-test-junit
          path: test-results/junit.xml
          if-no-files-found: warn

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bun-test-coverage
          path: coverage/lcov.info
          if-no-files-found: warn
